name: Sync PR to Feishu

on:
  pull_request:
    types: [opened, closed, reopened, labeled, unlabeled, assigned, unassigned, edited]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Sync PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BITABLE_TOKEN: ${{ secrets.FEISHU_BITABLE_TOKEN }}
          FEISHU_ISSUE_TABLE_ID: ${{ secrets.FEISHU_ISSUE_TABLE_ID }}
          FEISHU_PR_TABLE_ID: ${{ secrets.FEISHU_PR_TABLE_ID }}
        run: |
          chmod +x .github/scripts/sync-gh-to-bitable.sh
          .github/scripts/sync-gh-to-bitable.sh pr ${{ github.event.pull_request.number }}
